all.my.orders=Будь ласка, виберіть замовлення(які) для перегляду.

my.specific.orders=При натисканні на замовлення відкриється меню з його налаштуваннями та інформацією.

my.order.settings=Якщо ви хочете скасувати замовлення або додати додаткову інформацію, просто натисніть відповідну кнопку.

cancel.my.order=Доброго дня!\n\
Ви можете запросити повернення коштів за ваше замовлення, але ми також пропонуємо можливість отримати безкоштовне замовлення на ваш рахунок.\n\
\n\
Підтверджуючи наступне замовлення, просто виберіть опцію «Використати безкоштовне замовлення».\n\
Якщо хочете отримати безкоштовне замовлення, оберіть «Безкоштовне замовлення».

request.free.order=Безкоштовне замовлення зараховане на ваш рахунок.\n\
При наступному замовленні просто виберіть «Використати безкоштовне замовлення».

request.refund=При поверненні коштів через комісію ви отримаєте лише 1,80 €.\n\
Цю інформацію також вказано у правилах користування.\n\
\n\
Якщо хочете запросити повернення, оберіть «Повернення».\n\
Ви також можете обрати безкоштовне замовлення, яке можна використати при наступному замовленні.\n\
Щоб дізнатись більше, оберіть «Безкоштовне замовлення».

accept.request.refund=Протягом 5 робочих днів гроші буде повернено на рахунок, з якого здійснено оплату.\n\
Вибачаємося за незручності.

add.information=Ви можете ввести додаткову інформацію, якщо це необхідно.\n\
Це може бути:\n\
• Текст\n\
• Голосове повідомлення (до 2 хвилин)\n\
• Фото\n\
• Документ

tasks.are.empty=Вибачте, але у вас наразі немає замовлень цього типу :(

task.title=Нам знадобиться трохи інформації, щоб записати вас:\n\
• Ваше прізвище, ім'я.\n\
• Куди ви хочете записатися і в який час вам зручно.\n\
• Номер телефону, куди потрібно записатися. Якщо ви його не вкажете, ми знайдемо його самі.\n\
• Якщо у вас немає номера телефону або адреси, вкажіть місце проживання (місто) та максимальну відстань,\n\
  яку ви готові проїхати заради запису.\n\
• Ви можете надіслати дані голосовим повідомленням (від 10 до 120 секунд) або простим текстом.\n\
• Після введення основної інформації ви можете додати фотографії та документи як додаткову інформацію.

task.title.error=Заголовок занадто короткий або довгий. Будь ласка, коротко опишіть суть проблеми.

process.info=Ви можете ввести додаткову інформацію, якщо це необхідно.\n\
Це може бути:\n\
• Текст\n\
• Голосове повідомлення (до 2 хвилин)\n\
• Фотографія\n\
• Документ\n\
\n\
Коли закінчите — ми знову попросимо підтвердити.\n\
Якщо додаткова інформація не потрібна — просто підтвердіть і перейдіть до оплати.

process.new.additional.info=Додаткова інформація успішно додана до вашого замовлення.\n\
Дякуємо, що обрали нас!

invalid.info.text=Повідомлення не підходить. Будь ласка, введіть не менше 10 символів.

invalid.info.voice=Повідомлення не підходить. Будь ласка, надішліть голосове повідомлення тривалістю більше 10 секунд.

invalid.info.default=Файл перевищує допустимий розмір (максимум 10 МБ).\n\
Будь ласка, зменшіть розмір і спробуйте ще раз.

process.error.too.much.infos=Перевищено допустимий обсяг інформації.\n\
Ви можете відслідковувати та редагувати її в «Мої замовлення».

process.task.payment.timeout=Вибачте, сталася помилка.\n\
Будь ласка, напишіть нашому оператору — ми допоможемо вам.\n\
Особистий контакт вашого оператора: @Nex1332

chose.language=Ласкаво просимо!\n\
Перед початком ознайомтеся з <a href="{0}">Угодою користувача</a>.\n\
Натискаючи «Продовжити», ви підтверджуєте згоду з умовами.

operators.command=Додаємо список контактів наших операторів.\n\
Звертайтеся до них напряму — вони готові допомогти: {0}

make.termin=Будь ласка, виберіть, куди ви хочете записатися.

make.document.order=Будь ласка, виберіть сферу, в якій вам потрібна допомога:

make.order=Доброго дня! Почнемо з заголовка.\n\
Будь ласка, введіть короткий опис вашої проблеми.\n\
Приклад: Запис у лікарню (від 3 до 50 символів).

back.to.menu=Що ви хочете зробити?

free.order=Протягом 30 хвилин ви отримаєте докладну інформацію щодо вашого запису.\n\
Ви можете змінити або скасувати замовлення через «Мої замовлення».\n\
Якщо виникне помилка — ви можете про неї повідомити.

free.order.error=Вибачте, у вас наразі немає безкоштовних замовлень.

task.answer.message=Ми вже розглянули ваше замовлення — ось деталі.\n\
Сподіваємось, усе зручно і зрозуміло!

accept.completed.task=Дякуємо за ваш відгук!\n\
Ми раді, що все пройшло добре.\n\
Завжди раді допомогти — чекаємо на вас знову!

empty.user.name=Вибачте, у вас відсутній нікнейм у Telegram.\n\
Будь ласка, зв'яжіться з нашими операторами для вирішення цього питання.\n\
Нижче список операторів — ви можете знайти їх у Telegram: {0}

experienced.confirm.time.event=Вибачте, час очікування минув.\n\
Будь ласка, створіть замовлення заново.\n\
Просимо вибачення.

unsupported.message.type=Вибачте, ми не підтримуємо цей тип повідомлень.\n\
Введіть команду /help, щоб побачити всі функції нашого бота та як ними користуватись.

