cancel.my.order=Hello!\n\
You can request a refund for your order, but we would also like to offer you the option to receive a free order credited to your account.\n\
\n\
When confirming your next order, simply select the option "Use free order".\n\
If you'd like to receive a free order on your account, please choose "Free order".

request.free.order=The free order has been credited to your account.\n\
