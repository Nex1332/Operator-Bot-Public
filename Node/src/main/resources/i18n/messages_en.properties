request.refund=When requesting a refund, you will receive only 1.80 due to the service fee.\n\
This information is also stated in the user agreement.\n\
\n\
If you would like to request a refund, please select "Refund".\n\
You can also choose a free order, which you can use for your next purchase.\n\
To learn more, select "Free order".

accept.request.refund=Within 5 business days, the money will be refunded to the account from which the payment was made.\n\
We apologize for the inconvenience caused.

add.information=You can enter additional information if necessary.\n\
This can be:\n\
• Text\n\
• Voice message (up to 2 minutes)\n\
• Photo\n\
• Document

tasks.are.empty=Sorry, but you currently have no orders of this type.

task.title=We will need some information to register you:\n\
• Your last name, first name.\n\
• Where you want to register and at what time it is convenient for you.\n\
• The phone number where you want to be registered. If you don't provide it, we will find it ourselves.\n\
• If you don't have a phone number or address, please provide your place of residence (city) and the maximum distance you are willing to travel for the appointment.\n\
• You can send the data as a voice message (from 10 to 120 seconds) or as plain text.\n\
• After entering the main information, you can add photos and documents as additional information.

task.title.error=The title is too short or too long. Please briefly state the issue.

process.info=You can enter additional information if necessary.\n\
This can be:\n\
• Text\n\
• Voice message (up to 2 minutes)\n\
• Photo\n\
• Document\n\
\n\
When you're done, we will ask you to confirm again.\n\
If no additional information is needed, just confirm and proceed to payment.

