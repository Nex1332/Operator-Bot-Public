all.my.orders=Пожалуйста, выберите заказ(ы), которые вы хотите просмотреть.

my.specific.orders=При нажатии на заказ откроется меню с его настройками и информацией.

my.order.settings=Если вы хотите отменить заказ или добавить дополнительную информацию, просто нажмите соответствующую кнопку.

cancel.my.order=Здравствуйте!\n\
Вы можете запросить возврат средств за ваш заказ, но мы также предлагаем вам возможность получить бесплатный заказ на ваш счет.\n\
\n\
При подтверждении следующего заказа просто выберите опцию «Использовать бесплатный заказ».\n\
Если хотите получить бесплатный заказ, выберите «Бесплатный заказ».

request.free.order=Бесплатный заказ был зачислен на ваш счет.\n\
При следующем заказе просто выберите «Использовать бесплатный заказ».

request.refund=При возврате средств из-за комиссии вы получите только 1,80 €.\n\
Эта информация также указана в правилах пользования.\n\
\n\
Если хотите запросить возврат, выберите «Возврат».\n\
Вы также можете выбрать бесплатный заказ, который можно использовать при следующем заказе.\n\
Чтобы узнать больше, выберите «Бесплатный заказ».

accept.request.refund=В течение 5 рабочих дней деньги будут возвращены на счет, с которого была произведена оплата.\n\
Приносим извинения за неудобства.

add.information=Вы можете ввести дополнительную информацию, если это необходимо.\n\
Это может быть:\n\
• Текст\n\
• Голосовое сообщение (до 2 минут)\n\
• Фото\n\
• Документ

tasks.are.empty=Извините, у вас нет заказов данного типа.

task.title=Нам понадобится некоторая информация, чтобы записать вас:\n\
• Ваши фамилия и имя.\n\
• Куда вы хотите записаться и в какое время вам удобно.\n\
• Телефон, по которому нужно записать. Если вы его не укажете — мы сами его найдём.\n\
• Если у вас нет телефона или адреса, укажите место проживания (город) и максимальное расстояние, которое вы готовы проехать для записи.\n\
• Вы можете отправить данные голосовым сообщением (от 10 до 120 секунд) или простым текстом.\n\
• После ввода основной информации вы можете добавить фотографии и документы как дополнительную информацию.

task.title.error=Заголовок слишком короткий или длинный. Пожалуйста, кратко опишите проблему.

process.info=Вы можете ввести дополнительную информацию, если это необходимо.\n\
Это может быть:\n\
• Текст\n\
• Голосовое сообщение (до 2 минут)\n\
• Фото\n\
• Документ\n\
\n\
Когда закончите, мы попросим вас подтвердить данные.\n\
Если дополнительная информация не нужна — просто подтвердите и продолжите оплату.

process.new.additional.info=Дополнительная информация успешно добавлена к вашему заказу.\n\
Спасибо, что выбираете нас!

invalid.info.text=Сообщение не подходит. Пожалуйста, введите не менее 10 символов.

invalid.info.voice=Сообщение не подходит. Пожалуйста, отправьте голосовое сообщение длительностью более 10 секунд.

invalid.info.default=Файл превышает допустимый размер (максимум 10 МБ). Пожалуйста, уменьшите размер и попробуйте снова.

process.error.too.much.infos=Превышен допустимый объем информации.\n\
Вы можете отслеживать и редактировать её в «Моих заказах».

process.task.payment.timeout=Извините, произошла ошибка.\n\
Пожалуйста, напишите нашему оператору — мы поможем вам.\n\
Личный контакт вашего оператора: @Nex1332

chose.language=Добро пожаловать!\n\
Перед началом работы ознакомьтесь с <a href="{0}">Пользовательским соглашением</a>.\n\
Нажимая «Продолжить», вы подтверждаете согласие с условиями.

operators.command=Прилагаем список контактов наших операторов.\n\
Обращайтесь к ним напрямую — они готовы помочь вам: {0}

make.termin=Пожалуйста, выберите, куда вы хотите записаться.

make.document.order=Пожалуйста, выберите сферу, в которой вам нужна помощь:

make.order=Здравствуйте! Давайте начнем с заголовка.\n\
Пожалуйста, введите краткое название вашей проблемы.\n\
Пример: Запись в больницу (от 3 до 50 символов).

back.to.menu=Что вы хотите сделать?

free.order=Через 30 минут вы получите подробную информацию о вашем термине.\n\
Вы можете изменить или отменить заказ через «Мои заказы».\n\
Если случится ошибка — вы можете сообщить о ней.

free.order.error=Извините, у вас нет бесплатных заказов.

task.answer.message=Мы уже рассмотрели ваш заказ — вот подробности.\n\
Надеемся, всё удобно и понятно!

accept.completed.task=Спасибо за ваш отклик!\n\
Нам приятно, что всё прошло хорошо.\n\
Рады были помочь — ждём вас снова!

empty.user.name=Извините, у вас отсутствует имя пользователя в Telegram.\n\
Пожалуйста, свяжитесь с нашими операторами для решения этого вопроса.\n\
Ниже список операторов, их можно найти в Telegram: {0}

experienced.confirm.time.event=Извините, время ожидания истекло.\n\
Пожалуйста, создайте заказ заново.\n\
Приносим извинения.

unsupported.message.type=Простите, мы не поддерживаем сообщения данного типа.\n\
Введите команду /help, чтобы увидеть все возможности бота и как ими пользоваться.

