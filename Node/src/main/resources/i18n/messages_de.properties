all.my.orders=Bitte wählen Sie die Bestellung(en) aus, die Sie ansehen möchten.

my.specific.orders=Beim Klicken auf die Bestellung öffnet sich ein Menü mit ihren Einstellungen und Informationen.

my.order.settings=Wenn Sie die Bestellung stornieren oder zusätzliche Informationen hinzufügen möchten, klicken Sie einfach auf die entsprechende Schaltfläche.

cancel.my.order=Hallo!\n\
Sie können eine Rückerstattung für Ihre Bestellung beantragen, aber wir möchten Ihnen auch die Möglichkeit anbieten, eine kostenlose Bestellung auf Ihr Konto zu erhalten.\n\
\n\
Bei der Bestätigung Ihrer nächsten Bestellung wählen Sie einfach die Option „Kostenlose Bestellung verwenden“.\n\
Wenn Sie eine kostenlose Bestellung auf Ihr Konto erhalten möchten, wählen Sie bitte „Kostenlose Bestellung“.

request.free.order=Die kostenlose Bestellung wurde Ihrem Konto gutgeschrieben.\n\
Wählen Sie bei Ihrer nächsten Bestellung einfach „Kostenlose Bestellung verwenden“.

request.refund=Bei einer Rückerstattung erhalten Sie aufgrund der Gebühr nur 1,80 €.\n\
Diese Information ist auch in den Nutzungsbedingungen angegeben.\n\
\n\
Wenn Sie eine Rückerstattung beantragen möchten, wählen Sie bitte „Rückerstattung“.\n\
Sie können auch eine kostenlose Bestellung wählen, die Sie bei Ihrer nächsten Bestellung nutzen können.\n\
Um mehr zu erfahren, wählen Sie „Kostenlose Bestellung“.

accept.request.refund=Innerhalb von 5 Werktagen wird das Geld auf das Konto zurückerstattet, von dem die Zahlung vorgenommen wurde.\n\
Wir entschuldigen uns für die entstandenen Unannehmlichkeiten.

add.information=Sie können zusätzliche Informationen eingeben, falls dies erforderlich ist.\n\
Dies kann sein:\n\
• Text\n\
• Eine Sprachnachricht (bis zu 2 Minuten)\n\
• Ein Foto\n\
• Ein Dokument

tasks.are.empty=Entschuldigung, aber Sie haben derzeit keine Bestellungen dieses Typs :(

task.title=Wir benötigen einige Informationen, um Sie einzutragen:\n\
• Ihren Nachnamen, Vornamen.\n\
• Wo Sie sich eintragen möchten und zu welcher Zeit es Ihnen passt.\n\
• Die Telefonnummer, unter der Sie eingetragen werden sollen. Wenn Sie diese nicht angeben, finden wir sie selbst heraus.\n\
• Wenn Sie keine Telefonnummer oder Adresse haben, geben Sie bitte Ihren Wohnort (Stadt) und die maximale Entfernung an,\n\
  die Sie für den Termin zurücklegen möchten.\n\
• Sie können die Daten als Sprachnachricht (von 10 bis 120 Sekunden) oder als einfachen Text senden.\n\
• Nach Eingabe der Hauptinformationen können Sie Fotos und Dokumente als zusätzliche Informationen hinzufügen.

task.title.error=Der Titel ist zu kurz oder zu lang. Bitte geben Sie kurz das Problem an.

process.info=Sie können zusätzliche Informationen eingeben, wenn dies erforderlich ist.\n\
Dies kann sein:\n\
• Text\n\
• Eine Sprachnachricht (bis zu 2 Minuten)\n\
• Ein Foto\n\
• Ein Dokument\n\
\n\
Wenn Sie fertig sind, werden wir Sie erneut um eine Bestätigung bitten.\n\
Wenn keine zusätzlichen Informationen erforderlich sind – bestätigen Sie einfach und fahren Sie mit der Zahlung fort.

process.new.additional.info=Zusätzliche Informationen wurden erfolgreich zu Ihrer Bestellung hinzugefügt.\n\
Vielen Dank, dass Sie sich für uns entschieden haben!

invalid.info.text=Die Nachricht ist nicht geeignet. Bitte geben Sie mindestens 10 Zeichen ein.

invalid.info.voice=Die Nachricht ist nicht geeignet. Bitte senden Sie eine Sprachnachricht mit einer Dauer von mehr als 10 Sekunden.

invalid.info.default=Die Datei überschreitet die zulässige Größe (maximal 10 MB).\n\
Bitte verkleinern Sie sie und versuchen Sie es erneut.

process.error.too.much.infos=Das zulässige Informationsvolumen wurde überschritten.\n\
Sie können sie unter „Meine Bestellungen“ verfolgen und bearbeiten.

process.task.payment.timeout=Entschuldigung, es ist ein Fehler aufgetreten.\n\
Bitte schreiben Sie unserem Operator – wir helfen Ihnen weiter.\n\
Persönlicher Kontakt Ihres Operators: @Nex1332

chose.language=Willkommen!\n\
Bitte lesen Sie vor Beginn die <a href="{0}">Nutzungsvereinbarung</a>.\n\
Mit dem Klick auf „Weiter“ bestätigen Sie Ihr Einverständnis mit den Bedingungen.

operators.command=Wir fügen eine Liste der Kontakte unserer Operatoren bei.\n\
Wenden Sie sich direkt an sie – sie sind bereit, Ihnen zu helfen: {0}

make.termin=Bitte wählen Sie aus, wohin Sie den Termin machen.

make.document.order=Bitte wählen Sie aus, in welchem Bereich Sie Hilfe benötigen:

make.order=Hallo! Beginnen wir mit der Überschrift.\n\
Bitte geben Sie eine kurze Beschreibung Ihres Problems ein.\n\
Beispiel: Termin im Krankenhaus (3 bis 50 Zeichen).

back.to.menu=Was möchten Sie tun?

free.order=In 30 Minuten erhalten Sie ausführliche Informationen zu Ihrem Termin.\n\
Sie können Ihre Bestellung über „Meine Bestellungen“ ändern oder stornieren.\n\
Sollte ein Fehler auftreten, können Sie diesen melden.

free.order.error=Entschuldigung, Sie haben momentan keine kostenlosen Bestellungen.

task.answer.message=Wir haben Ihre Bestellung bereits überprüft – hier sind die Details.\n\
Wir hoffen, alles ist für Sie bequem und verständlich!

accept.completed.task=Vielen Dank für Ihr Feedback!\n\
Es freut uns, dass alles gut verlaufen ist.\n\
Wir haben gerne geholfen – wir freuen uns auf ein Wiedersehen!

empty.user.name=Entschuldigung, Sie haben keinen Benutzernamen in Telegram.\n\
Bitte wenden Sie sich an unsere Operatoren, um dieses Problem zu lösen.\n\
Unten finden Sie eine Liste unserer Operatoren – Sie können sie auf Telegram kontaktieren: {0}

experienced.confirm.time.event=Entschuldigung, die Wartezeit ist abgelaufen.\n\
Wir entschuldigen uns aufrichtig, aber Sie müssen die Bestellung erneut erstellen.

unsupported.message.type=Entschuldigung, aber wir unterstützen diesen Nachrichtentyp nicht.\n\
Geben Sie den Befehl /help ein, um alle Funktionen unseres Bots und deren Verwendung anzusehen.

